name: mobile-android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'cardDB.json'
      - 'constants.json'
      - 'default_config.toml'
      - 'events.json'
      - 'scenario_ramen.json'
      - 'text_data_dict.json'
      - 'umaDB.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native library and package assets
        working-directory: mobile
        run: bash ./scripts/build-native.sh
      - name: Assemble debug APK
        working-directory: mobile
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
